  <path id="a-link-3" d="M1090 142 H1135" class="arrow" />
  <path id="a-link-4" d="M1445 142 H1490" class="arrow" />
  <path id="b-link-1" d="M315 477 H345" class="arrow" />
  <path id="b-link-2" d="M625 477 H655" class="arrow" />
  <path id="b-link-3" d="M935 477 H965" class="arrow" />
  <path id="b-link-4" d="M1245 477 H1275" class="arrow" />
  <path id="b-link-5" d="M1555 477 H1585" class="arrow" />
  <path id="c-link-1" d="M415 1022 H446" class="arrow" />
  <path id="c-link-2" d="M836 1022 H867" class="arrow" />
  <path id="c-link-3" d="M1257 1022 H1288" class="future-line" />
  <path id="c-link-4" d="M1538 1022 H1569" class="future-line" />
  <path id="wiki-input-1" d="M1658 209.5 V357 H175 V404.5" class="green" />
  <path id="wiki-input-2" d="M1105 357 V404.5" class="green" />
  <path id="cycle-ledger" d="M795 804 V549.5" class="cycle" />
  <path id="cycle-report" d="M1415 804 V549.5" class="cycle" />
  <path id="evidence-input" d="M1725 549.5 V920 H235 V944.5" class="arrow" />
<path id="wiki-proposal-input" class="green" d="M175 357 H23 V1022 H55" /><path id="cycle-bus" class="cycle" d="M175 804 H1415" /><path id="cycle-researcher" class="arrow" d="M175 804 V549.5" /><path id="work-cycle" class="cycle" d="M980 764.5 V804" /></svg>
